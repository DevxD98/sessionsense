plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.kotlin.kapt"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

// Versioning: version.properties holds a semver versionName; versionCode is derived from it so the two can't drift.
def versionProperties = new Properties()
rootProject.file("version.properties").withInputStream { versionProperties.load(it) }
def semverCode = { String name ->
    def m = name =~ /^(\d+)\.(\d{1,3})\.(\d{1,3})$/
    if (!m.matches()) throw new GradleException("version.properties: '$name' is not a MAJOR.MINOR.PATCH version (minor and patch at most 999).")
    m.group(1).toInteger() * 1_000_000 + m.group(2).toInteger() * 1_000 + m.group(3).toInteger()
}
def appVersionName = versionProperties["versionName"] as String
def appVersionCode = semverCode(appVersionName)
def lastReleasedName = (versionProperties["lastReleasedVersionName"] ?: "0.0.0") as String
// A release build of an already-published version would be an APK that can never install as an update.
gradle.taskGraph.whenReady { graph ->
    def releasing = graph.allTasks.any { it.project == project && it.name ==~ /(assemble|bundle|package)\w*Release/ }
    if (releasing && appVersionCode <= semverCode(lastReleasedName))
        throw new GradleException("versionName $appVersionName was already released (last release: $lastReleasedName). Bump version.properties, or run scripts/release.sh.")
}

android {
    namespace "com.sessionsense.session_sense"
    compileSdk 36
    defaultConfig {
        applicationId "com.sessionsense.session_sense"
        minSdk 26
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
    }
    // sideload: the APK published on GitHub Releases, with the in-app updater (the default for builds and adb installs).
    // play: no self-updater and no REQUEST_INSTALL_PACKAGES, as Play policy requires; ready for Play in-app updates later.
    flavorDimensions "distribution"
    productFlavors {
        sideload {
            dimension "distribution"
            isDefault true
            buildConfigField "String", "UPDATE_MANIFEST_URL", '"https://github.com/DevxD98/sessionsense-releases/releases/latest/download/update.json"'
        }
        play { dimension "distribution" }
    }
    signingConfigs {
        release {
            keyAlias keystoreProperties["keyAlias"]
            keyPassword keystoreProperties["keyPassword"]
            storeFile keystoreProperties["storeFile"] ? file("${rootDir}/${keystoreProperties["storeFile"]}") : null
            storePassword keystoreProperties["storePassword"]
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    buildFeatures { compose true; buildConfig true }
    packaging { resources.excludes += "/META-INF/{AL2.0,LGPL2.1}" }
}

dependencies {
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "androidx.activity:activity-compose:1.11.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.4"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4"
    implementation "androidx.navigation:navigation-compose:2.9.5"
    implementation "androidx.compose.ui:ui:1.9.1"
    implementation "androidx.compose.ui:ui-tooling-preview:1.9.1"
    debugImplementation "androidx.compose.ui:ui-tooling:1.9.1"
    implementation "androidx.compose.foundation:foundation:1.9.1"
    implementation "androidx.compose.material3:material3:1.4.0"
    implementation "androidx.datastore:datastore-preferences:1.1.7"
    implementation "androidx.room:room-runtime:2.8.0"
    implementation "androidx.room:room-ktx:2.8.0"
    kapt "androidx.room:room-compiler:2.8.0"
    implementation "androidx.security:security-crypto:1.1.0"
    implementation "androidx.work:work-runtime-ktx:2.10.3"
    implementation "androidx.glance:glance-appwidget:1.1.1"
    implementation "com.materialkolor:material-kolor:3.0.1"
    implementation "dev.chrisbanes.haze:haze:1.5.4"
    implementation "dev.chrisbanes.haze:haze-materials:1.5.4"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    testImplementation "junit:junit:4.13.2"
    // android.jar ships org.json as stubs, so local unit tests need the real implementation.
    testImplementation "org.json:json:20240303"
}
kapt { correctErrorTypes true }

// Flavors rename the variant tasks; keep the pre-flavor names working. Tests and lint cover both flavors,
// installDebug installs the sideload build (the one on the phone).
tasks.register("testDebugUnitTest") { group "verification"; dependsOn "testSideloadDebugUnitTest", "testPlayDebugUnitTest" }
tasks.register("lintDebug") { group "verification"; dependsOn "lintSideloadDebug", "lintPlayDebug" }
tasks.register("installDebug") { group "install"; dependsOn "installSideloadDebug" }
